apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aspecta
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Infurox/k8s-gitops-demo.git
    targetRevision: main
    path: chart
  destination:
    server: https://kubernetes.default.svc
    namespace: aspecta
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
