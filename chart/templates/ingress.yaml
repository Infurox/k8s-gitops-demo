apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aspecta
  namespace: aspecta
spec:
  ingressClassName: nginx
  rules:
    - host: aspecta.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
