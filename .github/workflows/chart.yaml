name: chart

on:
  push:
    branches: [main]
    paths:
      - 'chart/**'
      - '.github/workflows/chart.yaml'
  pull_request:
    paths:
      - 'chart/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint chart/

      - name: Helm template
        run: helm template aspecta chart/ -n aspecta > /tmp/rendered.yaml

      - name: Summary
        run: |
          echo "Rendered objects:"
          grep -c '^kind:' /tmp/rendered.yaml
          grep '^kind:' /tmp/rendered.yaml | sort | uniq -c
