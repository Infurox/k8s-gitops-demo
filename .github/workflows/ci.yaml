name: ci

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yaml'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: true
          tags: ghcr.io/infurox/aspecta-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: true
          tags: ghcr.io/infurox/aspecta-frontend:${{ github.sha }}

      - name: Install yq
        run: |
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update chart
        run: |
          yq -i '.backend.image.tag = strenv(GITHUB_SHA)' chart/values.yaml
          yq -i '.frontend.image.tag = strenv(GITHUB_SHA)' chart/values.yaml
          yq -i '.version = "0.1." + strenv(GITHUB_RUN_NUMBER)' chart/Chart.yaml

      - name: Commit chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml chart/Chart.yaml
          git commit -m "ci: bump image tag to ${GITHUB_SHA} [skip ci]" || exit 0
          git push
